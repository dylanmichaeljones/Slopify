<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sätted - Slopify</title>
    <link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
</head>
<body>

    <header>
        <nav>

            <img src="images/Slopify.png" alt="Slopify logo" class="logo">

            <ul>
                <li><a href="index.html">Kodu</a></li>
                <li><a href="recipespage.html">Retseptid</a></li>
                <li><a href="accountpage.html">Minu kasutaja</a></li>
                <li><a href="settingspage.html">Sätted</a></li>
            </ul>
            <form class="search">
                <label for="search">Otsi retsepte</label>
                <input id="search" name="search" type="text" placeholder="...">
            </form>
        </nav>
    </header>

<main>

    <section class="settings">
        <h1>Konto sätted</h1>

        <form class="settings-form">

            <div class="form-group">
                <label for="profile-pic">Profiilipilt</label>
                <input id="profile-pic" name="profile-pic" type="file" accept="image/*">
            </div>

            <div class="form-group">
                <label for="username">Kasutajanimi</label>
                <input id="username" name="username" type="text" placeholder="Sinu nimi..." required>
            </div>

            <div class="form-group">
                <label for="description">Kirjeldus</label>
                <textarea id="description" name="description" rows="4" placeholder="Kasutaja kirjeldus..."></textarea>
            </div>

            <button type="submit">Salvesta muudatused</button>

        </form>
    </section>

</main>

<footer>
    <p>© 2026 Slopify</p>
</footer>

</body>
</html>
